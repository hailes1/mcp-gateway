[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Simple MCP Gateway example project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "uvicorn>=0.35.0"
]

[dependency-groups]
dev = [
  "httpx>=0.28.1"
]

[tool.uv]
default-groups = ["dev"]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
